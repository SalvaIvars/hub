[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/extractor",
    "crates/feeds",
    "crates/storage",
    "crates/pipeline",
    "crates/embeddings",
    "crates/app",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
quick-xml = "0.41"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
anyhow = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
feed-rs = "2.4"
rs-trafilatura = "0.2"
async-trait = "0.1"
